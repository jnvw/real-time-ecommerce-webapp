services:
  redis:
    image: redis:7-alpine
    container_name: collab_commerce_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: collab_commerce_web
    command: daphne -b 0.0.0.0 -p 8000 collab_commerce.asgi:application
    volumes:
      - ./collab_commerce:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=django-insecure-vw_*!00ue)v3i5p39zgx-yqb85)l1x#76xd=-d6_4o6*+($)4@
      - DEBUG=True
      - ALLOWED_HOSTS=.railway.app,localhost,127.0.0.1,*
      - CSRF_TRUSTED_ORIGINS=https://*.up.railway.app
      - SESSION_COOKIE_SECURE=True
      - CSRF_COOKIE_SECURE=True
      - DJANGO_SETTINGS_MODULE=collab_commerce.settings
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  static_volume:
  media_volume:

