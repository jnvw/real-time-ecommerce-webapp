services:
  redis:
    image: redis:7-alpine
    container_name: collab_commerce_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: collab_commerce_web
    command: daphne -b 0.0.0.0 -p 8000 collab_commerce.asgi:application
    volumes:
      - ./collab_commerce:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DJANGO_SETTINGS_MODULE=collab_commerce.settings
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  static_volume:
  media_volume:

